version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "18080:80"
    depends_on:
      - backend

  redis:
    image: redis:7.2-alpine
